<app-sidebar
[isMobile]="isMobile"
[mobileVisible]="mobileSidebarVisible" 
  (sidebarToggle)="onSidebarToggle($event)"
  [ngClass]="{ 'mobile-visible': mobileSidebarVisible }"
  (mobileSidebarClose)="onMobileSidebarClose()"
></app-sidebar>

<div class="right-container">
  <app-header
  [isMobile]="isMobile"
  [currentPageTitle]="pageTitle"
    (mobileSidebarToggle)="onMobileSidebarToggle()"
  ></app-header>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
