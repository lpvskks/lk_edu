<div class="search-container">
  <h3>Поиск</h3>
  <form class="events-search-form" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field
      appearance="outline"
      floatLabel="always"
      class="events-name-input"
    >
      <mat-label>Название мероприятия</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <button type="submit" class="search-btn">НАЙТИ</button>

    <div class="date-picker-wrapper">
      <mat-form-field
        appearance="outline"
        floatLabel="always"
        class="events-date-input"
      >
        <mat-label>Дата мероприятия</mat-label>
        <input
          matInput
          [value]="form.value.date | date : 'dd.MM.yyyy'"
          readonly
          (focus)="openCalendar()"
        />
        <img
          matSuffix
          src="/icons/events/Date.jpg"
          class="date-icon"
          alt="calendar"
          (click)="openCalendar()"
        />
      </mat-form-field>

      <app-calendar-component
        *ngIf="showCalendar"
        class="calendar-overlay visible"
        (dateSelected)="onDatePicked($event)"
        (cancelled)="onCancel()"
      ></app-calendar-component>
    </div>
  </form>
</div>
